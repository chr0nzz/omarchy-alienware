<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus-busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.xyzlab.Alienware1"/>
    <allow send_destination="org.xyzlab.Alienware1"/>
  </policy>

  <policy context="default">
    <deny own="org.xyzlab.Alienware1"/>
    <allow send_destination="org.xyzlab.Alienware1" send_interface="org.xyzlab.Alienware1"/>
    <allow send_destination="org.xyzlab.Alienware1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.xyzlab.Alienware1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.xyzlab.Alienware1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
